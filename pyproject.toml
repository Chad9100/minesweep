[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minesweep-cli"
version = "0.1.0"
description = "Turn-based Minesweeper for the terminal, with saves and best times."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chad Mowlavie" }]
requires-python = ">=3.10"
keywords = ["minesweeper", "game", "terminal", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
tui = ["windows-curses>=2.3; sys_platform == 'win32'"]

[project.scripts]
minesweep = "minesweep.cli:main"

[project.urls]
Homepage = "https://github.com/Chad9100/minesweep"
Issues = "https://github.com/Chad9100/minesweep/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
